name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build direct release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Guard storage bind paths
        run: |
          set -euo pipefail
          BIND_TABLE="app/src/main/java/app/termx/runtime/ProotCommand.kt"
          outside_table="$(rg -n --glob '*.kt' '"/(sdcard|storage)(/|")' app/src/main/java | rg -v "$BIND_TABLE:" || true)"
          if [ -n "$outside_table" ]; then
            echo "Storage paths may be added only by the tier-aware BindTable:"
            echo "$outside_table"
            exit 1
          fi
          outside_bind="$(rg -n --glob '*.kt' 'add\("-b"\)' app/src/main/java | rg -v "$BIND_TABLE:" || true)"
          if [ -n "$outside_bind" ]; then
            echo "PRoot bind arguments may be added only by BindTable:"
            echo "$outside_bind"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install pinned native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Runs before the keystore is decoded, so tests never see the signing config.
      - name: Unit tests
        run: ./gradlew testDirectDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          TERMX_KEYSTORE_B64: ${{ secrets.TERMX_KEYSTORE_B64 }}
        run: |
          if [ -z "$TERMX_KEYSTORE_B64" ]; then
            echo "::warning::TERMX_KEYSTORE_B64 is not set. The APK will be UNSIGNED and the release job will refuse to publish it."
            exit 0
          fi
          KS="$RUNNER_TEMP/termx-release.keystore"
          printf '%s' "$TERMX_KEYSTORE_B64" | base64 --decode > "$KS"
          echo "TERMX_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build direct release APK
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Check 16 KB ZIP and ELF alignment, report signature, stage APK
        env:
          TERMX_KEYSTORE_PASSWORD: ${{ secrets.TERMX_KEYSTORE_PASSWORD }}
          TERMX_KEY_ALIAS: ${{ secrets.TERMX_KEY_ALIAS }}
          TERMX_KEY_PASSWORD: ${{ secrets.TERMX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/direct/release -name '*.apk' -print -quit)"
          test -n "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          READELF="$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          if [ -n "${TERMX_KEYSTORE_FILE:-}" ]; then
            "$BT/apksigner" sign \
              --ks "$TERMX_KEYSTORE_FILE" \
              --ks-key-alias "$TERMX_KEY_ALIAS" \
              --ks-pass env:TERMX_KEYSTORE_PASSWORD \
              --key-pass env:TERMX_KEY_PASSWORD \
              --min-sdk-version 1 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out "$RUNNER_TEMP/TermX-signed.apk" "$APK"
            cp "$RUNNER_TEMP/TermX-signed.apk" "$APK"
          fi

          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          python3 - "$APK" "$READELF" <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          import zipfile

          apk, readelf = sys.argv[1:]
          required = {
              f'lib/{abi}/lib{library}.so'
              for abi in ('arm64-v8a', 'x86_64')
              for library in ('proot', 'loader')
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f'Missing native runtime libraries: {sorted(missing)}')
              for name in sorted(required):
                  with tempfile.NamedTemporaryFile() as elf:
                      elf.write(archive.read(name))
                      elf.flush()
                      output = subprocess.check_output([readelf, '-lW', elf.name], text=True)
                  aligns = [int(line.split()[-1], 0) for line in output.splitlines()
                            if re.match(r'^\s*LOAD\s', line)]
                  if not aligns or min(aligns) < 16384:
                      raise SystemExit(f'{name} has LOAD alignment below 16 KB: {aligns}')
                  print(f'{name}: LOAD alignments {aligns}')
          PY
          echo "16 KB ZIP and ELF alignment: OK"

          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          OUT="TermX-${VERSION}-direct.apk"
          mkdir -p dist
          cp "$APK" "dist/$OUT"
          cp NOTICE licenses/GPL-2.0-or-later.txt licenses/LGPL-3.0-or-later.txt licenses/PROOT-SOURCE.txt dist/
          tar -czf "dist/TermX-proot-source-${VERSION}.tar.gz" app/src/main/cpp licenses/GPL-2.0-or-later.txt licenses/LGPL-3.0-or-later.txt licenses/PROOT-SOURCE.txt

          if "$BT/apksigner" verify --min-sdk-version 1 --verbose --print-certs "dist/$OUT" > "$RUNNER_TEMP/signer.txt" 2>&1; then
            echo "Signature: OK"
            cat "$RUNNER_TEMP/signer.txt"
            grep -q 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/signer.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signer.txt"
            grep -i 'SHA-256' "$RUNNER_TEMP/signer.txt" || true
          else
            echo "Signature: NOT SIGNED (expected only on branches without secrets)"
          fi

          (cd dist && sha256sum "$OUT" > "$OUT.sha256")
          cat "dist/$OUT.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termx-apk
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: termx-apk
          path: dist

      - name: Refuse unsigned builds and tag mismatches
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName v$VERSION in app/build.gradle.kts"
            exit 1
          fi
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if ! "$BT/apksigner" verify dist/*.apk >/dev/null 2>&1; then
            echo "APK is not signed. Add the TERMX_* secrets (see README.md) and push the tag again."
            exit 1
          fi
          echo "Tag and signature checks passed for $GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "TermX $GITHUB_REF_NAME" --generate-notes
