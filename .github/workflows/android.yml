name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build direct release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install pinned native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Runs before the keystore is decoded, so tests never see the signing config.
      - name: Unit tests
        run: ./gradlew testDirectDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          TERMX_KEYSTORE_B64: ${{ secrets.TERMX_KEYSTORE_B64 }}
        run: |
          if [ -z "$TERMX_KEYSTORE_B64" ]; then
            echo "::warning::TERMX_KEYSTORE_B64 is not set. The APK will be UNSIGNED and the release job will refuse to publish it."
            exit 0
          fi
          KS="$RUNNER_TEMP/termx-release.keystore"
          printf '%s' "$TERMX_KEYSTORE_B64" | base64 --decode > "$KS"
          echo "TERMX_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build direct release APK
        env:
          TERMX_KEYSTORE_PASSWORD: ${{ secrets.TERMX_KEYSTORE_PASSWORD }}
          TERMX_KEY_ALIAS: ${{ secrets.TERMX_KEY_ALIAS }}
          TERMX_KEY_PASSWORD: ${{ secrets.TERMX_KEY_PASSWORD }}
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Check 16 KB ZIP and ELF alignment, report signature, stage APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/direct/release -name '*.apk' -print -quit)"
          test -n "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          READELF="$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          python3 - "$APK" "$READELF" <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          import zipfile

          apk, readelf = sys.argv[1:]
          required = {
              f'lib/{abi}/lib{library}.so'
              for abi in ('arm64-v8a', 'x86_64')
              for library in ('proot', 'loader')
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f'Missing native runtime libraries: {sorted(missing)}')
              for name in sorted(required):
                  with tempfile.NamedTemporaryFile() as elf:
                      elf.write(archive.read(name))
                      elf.flush()
                      output = subprocess.check_output([readelf, '-lW', elf.name], text=True)
                  aligns = [int(line.split()[-1], 0) for line in output.splitlines()
                            if re.match(r'^\s*LOAD\s', line)]
                  if not aligns or min(aligns) < 16384:
                      raise SystemExit(f'{name} has LOAD alignment below 16 KB: {aligns}')
                  print(f'{name}: LOAD alignments {aligns}')
          PY
          echo "16 KB ZIP and ELF alignment: OK"

          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          OUT="TermX-${VERSION}-direct.apk"
          mkdir -p dist
          cp "$APK" "dist/$OUT"
          cp NOTICE licenses/GPL-2.0-or-later.txt licenses/LGPL-3.0-or-later.txt licenses/PROOT-SOURCE.txt dist/
          tar -czf "dist/TermX-proot-source-${VERSION}.tar.gz" app/src/main/cpp licenses/GPL-2.0-or-later.txt licenses/LGPL-3.0-or-later.txt licenses/PROOT-SOURCE.txt

          if "$BT/apksigner" verify --print-certs "dist/$OUT" > "$RUNNER_TEMP/signer.txt" 2>&1; then
            echo "Signature: OK"
            grep -i 'SHA-256' "$RUNNER_TEMP/signer.txt" || true
          else
            echo "Signature: NOT SIGNED (expected only on branches without secrets)"
          fi

          (cd dist && sha256sum "$OUT" > "$OUT.sha256")
          cat "dist/$OUT.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termx-apk
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: termx-apk
          path: dist

      - name: Refuse unsigned builds and tag mismatches
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName v$VERSION in app/build.gradle.kts"
            exit 1
          fi
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if ! "$BT/apksigner" verify dist/*.apk >/dev/null 2>&1; then
            echo "APK is not signed. Add the TERMX_* secrets (see README.md) and push the tag again."
            exit 1
          fi
          echo "Tag and signature checks passed for $GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "TermX $GITHUB_REF_NAME" --generate-notes

  arm64-runtime-smoke:
    # Trigger only for the explicit smoke commit to avoid an emulator boot on every build.
    if: contains(github.event.head_commit.message, '[arm64-runtime-smoke]')
    needs: build
    name: Install Wolfi and run a command on ARM64 Android
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download release candidate APK artifact
        uses: actions/download-artifact@v4
        with:
          name: termx-apk
          path: dist

      - name: Install ARM64 Android emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "system-images;android-35;google_apis;arm64-v8a"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name TermXArm64 --package "system-images;android-35;google_apis;arm64-v8a" \
            --device pixel_2 --force

      - name: Boot emulator and install TermX
        run: |
          set -euo pipefail
          mkdir -p smoke
          "$ANDROID_HOME/emulator/emulator" -avd TermXArm64 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > smoke/emulator.log 2>&1 &
          adb wait-for-device
          deadline=$((SECONDS + 900))
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              tail -n 200 smoke/emulator.log
              exit 1
            fi
            sleep 5
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          APK="$(find dist -maxdepth 1 -name 'TermX-*-direct.apk' -print -quit)"
          test -n "$APK"
          adb install "$APK"
          adb shell monkey -p app.termx 1

      - name: Install Wolfi, start a terminal, and enter uname
        run: |
          set -euo pipefail
          mkdir -p smoke
          python3 - <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET

          def hierarchy():
              subprocess.run(['adb', 'shell', 'uiautomator', 'dump', '/sdcard/window.xml'],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
              return ET.fromstring(subprocess.check_output(['adb', 'shell', 'cat', '/sdcard/window.xml']))

          def tap_text(expected, timeout=120):
              end = time.time() + timeout
              while time.time() < end:
                  try:
                      root = hierarchy()
                      node = next((n for n in root.iter('node') if n.attrib.get('text') == expected), None)
                      if node is not None:
                          left, top, right, bottom = map(int, re.findall(r'\d+', node.attrib['bounds']))
                          subprocess.run(['adb', 'shell', 'input', 'tap',
                                          str((left + right) // 2), str((top + bottom) // 2)], check=True)
                          return
                  except (subprocess.CalledProcessError, ET.ParseError):
                      pass
                  time.sleep(5)
              raise SystemExit(f'Timed out waiting for UI text: {expected}')

          tap_text('Install Wolfi')
          tap_text('Wolfi installed. Tap Start to open it.', timeout=900)
          tap_text('Start Wolfi')
          time.sleep(4)
          # Exercise the sticky Ctrl key with ^t, then reset it before the shell command.
          tap_text('CTRL', timeout=20)
          subprocess.run(['adb', 'shell', 'input', 'keyevent', '48'], check=True)
          tap_text('CTRL', timeout=20)
          # A screen tap reveals the soft keyboard, then the user-entered command is sent.
          subprocess.run(['adb', 'shell', 'input', 'tap', '540', '900'], check=True)
          time.sleep(2)
          subprocess.run(['adb', 'shell', 'input', 'text', 'uname%sa'], check=True)
          subprocess.run(['adb', 'shell', 'input', 'keyevent', '66'], check=True)
          time.sleep(4)
          subprocess.run(['adb', 'exec-out', 'screencap', '-p'],
                         stdout=open('smoke/termx-arm64-uname.png', 'wb'), check=True)
          subprocess.run(['adb', 'logcat', '-d', '-t', '3000'],
                         stdout=open('smoke/logcat.txt', 'wb'), check=True)
          PY

      - name: Upload ARM64 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termx-arm64-runtime-smoke
          path: smoke/
          if-no-files-found: warn
