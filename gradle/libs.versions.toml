# Toolchain copied from wolfi-terminal (known to build in CI). Bump with Renovate, one group at a time.
[versions]
agp = "9.2.1"
kotlin = "2.3.20"
coreKtx = "1.17.0"
activity = "1.12.0"
lifecycle = "2.10.0"
annotation = "1.9.0"
composeBom = "2025.11.01"
termuxEmulator = "v0.118.3"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
termux-emulator = { module = "com.github.termux.termux-app:terminal-emulator", version.ref = "termuxEmulator" }
junit = { module = "junit:junit", version.ref = "junit" }
